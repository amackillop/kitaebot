# Supply-chain policy for `cargo deny check` (just audit, part of the
# commit gate). Advisories come from the RustSec database; cooldown in
# dependabot.yml covers the pre-discovery window, this covers the rest.

# Audit the graph we ship: without this, checks run over the lock's
# cross-platform union and every windows/android-only shim shows up
# as duplicate-version noise.
[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
]

# No dependency may come from anywhere but crates.io. A git dependency
# is a policy decision: add its org here explicitly or it fails the gate.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
